# nginx config for the production frontend container.

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # The API lives on the same origin as the site, so the browser needs no CORS setup.
    # (No trailing slash after the address: the /api/ prefix is passed through unchanged.)
    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Built assets have a content hash in their file names, so they never change and can be
    # cached forever.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Everything else belongs to the single-page app: a share link like /city/octocat has no
    # file of its own, so serve index.html and let the app read the path. "no-cache" makes
    # browsers check for a new index.html (and so new assets) after each deploy.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
