<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Codebase Cities</title>
  </head>
  <body>
    <!-- The bar and the status line share one fixed container, so the status always sits
         right under the bar, however many rows the bar wraps onto on small screens. -->
    <div class="top">
      <header class="bar">
        <h1>Codebase Cities</h1>
        <form id="search" autocomplete="off">
          <input
            id="username"
            name="username"
            placeholder="GitHub username"
            maxlength="39"
            spellcheck="false"
            required
          />
          <button type="submit">Build city</button>
        </form>
        <div class="sound">
          <button id="play" type="button" disabled title="Play this city's music">▶ Play</button>
          <input id="volume" type="range" min="0" max="100" value="70" aria-label="Music volume" />
        </div>
        <button id="daynight" type="button" title="Switch between day and night">☀️ Day</button>
      </header>
      <p id="status" role="status" aria-live="polite"></p>
    </div>

    <!-- The 3D canvas (and the district labels on top of it) go in here. -->
    <main id="viewport"></main>

    <!-- Welcome, building progress, and errors (see src/overlay.ts). -->
    <section id="overlay" class="overlay" hidden></section>

    <!-- The year slider (see src/timeline.ts). -->
    <div id="timeline" class="timeline" hidden>
      <button id="timeline-play" type="button" title="Fly through the years">▶</button>
      <span id="timeline-start" class="year-edge"></span>
      <input id="timeline-slider" type="range" step="1" aria-label="Year to show" />
      <span id="timeline-year" class="year">Now</span>
      <span id="timeline-spinner" class="spinner" hidden></span>
    </div>

    <div id="info">
      <div class="info-row">
        <span id="city-info"></span>
        <button id="share" type="button" class="link-button" hidden>🔗 Copy link</button>
      </div>
      <div id="now-playing"></div>
    </div>
    <div id="tooltip" hidden></div>
    <p id="hint">Drag to orbit · right-drag to pan · scroll to zoom · hover a building</p>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
