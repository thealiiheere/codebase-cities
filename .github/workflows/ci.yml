name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    # Real Postgres and Redis, so integration tests (skipped locally without
    # TEST_DATABASE_URL) always run here.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: cities
          POSTGRES_PASSWORD: cities
          POSTGRES_DB: cities_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cities -d cities_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      TEST_DATABASE_URL: postgresql+asyncpg://cities:cities@localhost:5432/cities_test

    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.19"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Lint
        run: uv run ruff check .

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Type check
        run: uv run mypy app tests migrations scripts

      - name: Test
        run: uv run pytest -v
