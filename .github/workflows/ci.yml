name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    # Real Postgres and Redis, so integration tests (skipped locally without
    # TEST_DATABASE_URL / TEST_REDIS_URL) always run here.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: cities
          POSTGRES_PASSWORD: cities
          POSTGRES_DB: cities_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cities -d cities_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      TEST_DATABASE_URL: postgresql+asyncpg://cities:cities@localhost:5432/cities_test
      TEST_REDIS_URL: redis://localhost:6379/0

    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.19"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Lint
        run: uv run ruff check .

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Type check
        run: uv run mypy app tests migrations scripts

      - name: Test
        run: uv run pytest -v

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Type-checks with tsc (strict), then builds the production bundle.
      - name: Type check and build
        run: npm run build

  # Builds the production images and smoke-tests the whole stack through nginx, the same way
  # a deployment runs it: migrations, API, worker, Postgres, Redis, and the static site.
  production-stack:
    runs-on: ubuntu-latest
    env:
      POSTGRES_PASSWORD: ci-only-password
      WEB_PORT: "8080"
    steps:
      - uses: actions/checkout@v5

      # docker-compose.prod.yml reads .env; CI needs no real secrets for a smoke test.
      - name: Create an empty .env
        run: touch .env

      - name: Build and start the production stack
        run: docker compose -f docker-compose.prod.yml up -d --build

      - name: Smoke test through nginx
        run: |
          for attempt in $(seq 1 60); do
            curl -fsS http://localhost:8080/api/health && break
            sleep 2
          done
          curl -fsS http://localhost:8080/api/health | grep -q '"status":"ok"'
          # The site itself, a share link (served by the single-page-app fallback), and the
          # demo data.
          curl -fsS http://localhost:8080/ | grep -q "<title>Codebase Cities</title>"
          curl -fsS http://localhost:8080/city/octocat | grep -q "<title>Codebase Cities</title>"
          curl -fsS -o /dev/null http://localhost:8080/demo-city.json
          # The API's error shape comes through the proxy intact.
          curl -sS http://localhost:8080/api/cities/octocat | grep -q '"code":"city_not_found"'

      - name: Show logs if anything failed
        if: failure()
        run: docker compose -f docker-compose.prod.yml logs --no-color
