# Production stack. On a server with Docker, from the repository root:
#
#   cp .env.example .env    # set GITHUB_TOKEN and a strong POSTGRES_PASSWORD
#   docker compose -f docker-compose.prod.yml up -d --build
#
# Only the `web` service (nginx) is reachable from outside, on WEB_PORT (default 80). The API,
# worker, Postgres, and Redis talk to each other on Docker's internal network. Put HTTPS in
# front of WEB_PORT with your platform or a reverse proxy (see the README's Deployment section).

# Settings shared by every service built from the backend image.
x-backend: &backend
  build: ./backend
  env_file: .env
  environment:
    ENVIRONMENT: production
    DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-cities}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-cities}
    REDIS_URL: redis://redis:6379/0
  restart: unless-stopped

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cities}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-cities}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    # Append-only persistence keeps queued jobs across a Redis restart.
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  # Applies database migrations once, then exits. The API and worker wait for it to succeed.
  migrate:
    <<: *backend
    command: ["alembic", "upgrade", "head"]
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy

  api:
    <<: *backend
    # --proxy-headers: trust nginx's X-Forwarded-* headers for the real client address.
    command:
      [
        "uvicorn", "app.main:create_app", "--factory",
        "--host", "0.0.0.0", "--port", "8000",
        "--workers", "2",
        "--proxy-headers", "--forwarded-allow-ips", "*",
      ]
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 6

  worker:
    <<: *backend
    command: ["arq", "app.worker.WorkerSettings"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  web:
    build: ./frontend
    ports:
      - "${WEB_PORT:-80}:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
