[project]
name = "codebase-cities"
version = "0.1.0"
description = "Turns a GitHub profile into a 3D city you can explore and hear."
authors = [
    { name = "thealiiheere", email = "rustamovakbar291@gmail.com" }
]
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.20.0",
    "arq>=0.28.0",
    "asyncpg>=0.32.0",
    "fastapi>=0.143.2",
    "httpx>=0.28.1",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.16.0",
    "redis>=5.3.1,<6",
    "sqlalchemy[asyncio]>=2.1.4",
    "uvicorn>=0.54.0",
]

# The backend is an application, not a library, so it is not built or installed as a package.
# Tests and tools import `app` from this directory directly.
[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "B",        # bugbear
    "UP",       # pyupgrade
    "SIM",      # simplify
    "N",        # pep8-naming
    "ASYNC",    # async pitfalls
    "RUF",      # ruff-specific
]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
# Alembic injects `op` and `context` at runtime; their stubs are partial.
module = ["migrations.*"]
disallow_untyped_calls = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "integration: needs real PostgreSQL / Redis (TEST_DATABASE_URL / TEST_REDIS_URL); skipped otherwise",
]

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "respx>=0.23.1",
    "ruff>=0.17.1",
]
